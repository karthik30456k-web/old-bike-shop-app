<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Clean Technical Outline of Superbike / Sports Bike (Yamaha R1 / RC200) -->
  <rect width="100%" height="100%" fill="#ffffff" stroke="none" />
  
  <!-- Rear Racing Wheel & Tyre -->
  <circle cx="95" cy="155" r="42" stroke-width="2.8" />
  <circle cx="95" cy="155" r="28" stroke-dasharray="6 3" stroke-width="1.8" />
  <circle cx="95" cy="155" r="10" fill="#000000" />
  
  <!-- Front Racing Wheel & Tyre -->
  <circle cx="315" cy="155" r="42" stroke-width="2.8" />
  <circle cx="315" cy="155" r="28" stroke-dasharray="6 3" stroke-width="1.8" />
  <circle cx="315" cy="155" r="10" fill="#000000" />
  
  <!-- Inverted Front Forks & Clip-ons -->
  <path d="M 315,155 L 275,65" stroke-width="2.8" />
  <path d="M 285,140 Q 315,115 340,145" stroke-width="2.2" />
  <!-- Clip-on Handlebars & Lever -->
  <path d="M 275,65 L 260,65 L 250,70" stroke-width="2.5" />
  <circle cx="270" cy="55" r="5" />
  
  <!-- Aerodynamic Racing Fairing & Windscreen -->
  <path d="M 275,65 Q 295,45 320,60 L 315,85 L 275,105" stroke-width="2.5" />
  <path d="M 280,60 L 305,45 L 315,60" stroke-width="1.8" />
  
  <!-- Fuel Tank with Knee Recesses -->
  <path d="M 275,65 Q 240,48 200,60 Q 185,75 180,95" stroke-width="2.8" />
  
  <!-- Deltabox Twin-Spar Aluminum Frame -->
  <path d="M 265,75 L 220,115 L 180,125 L 155,155" stroke-width="2.5" />
  <path d="M 220,115 L 205,155 L 160,155" stroke-width="2" />
  
  <!-- High Upswept Racing Tail Cowl & Solo Seat -->
  <path d="M 180,95 L 140,85 L 85,60 L 115,100 L 170,115" stroke-width="2.5" />
  <path d="M 85,60 L 75,70 L 115,100" stroke-width="2" />
  
  <!-- Racing Swingarm -->
  <path d="M 170,125 L 95,155" stroke-width="3" />
  
  <!-- Titanium Upswept Akrapovic Exhaust Cannister -->
  <path d="M 160,150 L 130,135 L 75,120 L 70,110 L 125,125 Z" stroke-width="2.2" />
  
  <text x="385" y="210" font-family="monospace" font-size="8" fill="#444444" text-anchor="end" stroke="none">SUPERBIKE LINE ART • GYTR RACING BLUEPRINT</text>
</svg>
