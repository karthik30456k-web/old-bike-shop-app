<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Clean Technical Outline of Naked Streetfighter (Yamaha FZ-S / Apache / Duke) -->
  <rect width="100%" height="100%" fill="#ffffff" stroke="none" />
  
  <!-- Rear Wheel & Tyre -->
  <circle cx="95" cy="155" r="42" stroke-width="2.8" />
  <circle cx="95" cy="155" r="28" stroke-dasharray="6 3" stroke-width="1.8" />
  <circle cx="95" cy="155" r="10" fill="#000000" />
  
  <!-- Front Wheel & Tyre -->
  <circle cx="315" cy="155" r="42" stroke-width="2.8" />
  <circle cx="315" cy="155" r="28" stroke-dasharray="6 3" stroke-width="1.8" />
  <circle cx="315" cy="155" r="10" fill="#000000" />
  
  <!-- Front Telescopic Forks -->
  <path d="M 315,155 L 275,75" stroke-width="2.8" />
  <path d="M 285,140 Q 315,115 340,145" stroke-width="2.2" />
  
  <!-- Wide Street Handlebar & Mirrors -->
  <path d="M 275,75 L 265,58 L 250,55" stroke-width="2.5" />
  <circle cx="245" cy="45" r="6" />
  <!-- Aggressive LED Headlamp Cluster -->
  <path d="M 275,75 L 298,82 L 305,95 L 285,102 Z" stroke-width="2.2" />
  
  <!-- Muscular Sculpted Fuel Tank with Air Shrouds (FZ-S signature) -->
  <path d="M 270,78 Q 235,50 195,68 Q 180,82 175,100" stroke-width="2.8" />
  <path d="M 265,82 L 278,110 L 250,118 L 240,95" stroke-width="2" />
  
  <!-- Engine Crankcase & Trellis Frame Section -->
  <path d="M 235,115 L 210,160 L 160,160 L 175,120 Z" stroke-width="2.2" />
  <circle cx="190" cy="142" r="14" stroke-width="2" />
  
  <!-- Step-Up Split Seat & Rear Tail -->
  <path d="M 175,100 Q 145,95 110,80 L 75,75 L 95,110 L 160,118" stroke-width="2.5" />
  <path d="M 110,80 L 125,70 L 85,68" stroke-width="2" />
  
  <!-- Box Section Swingarm & Monoshock -->
  <path d="M 160,125 L 95,155" stroke-width="3" />
  <path d="M 165,125 L 145,110" stroke-width="2.5" />
  
  <!-- Midship Exhaust Silencer -->
  <path d="M 180,155 L 140,148 L 105,145 L 100,135 L 140,138 Z" stroke-width="2.2" />
  
  <text x="385" y="210" font-family="monospace" font-size="8" fill="#444444" text-anchor="end" stroke="none">STREETFIGHTER LINE ART • PRECISION BLUEPRINT</text>
</svg>
