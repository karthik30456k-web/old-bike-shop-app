<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Clean Technical Outline of Royal Enfield Classic 350 Cruiser -->
  <rect width="100%" height="100%" fill="#ffffff" stroke="none" />
  
  <!-- Spoked Rear Wheel -->
  <circle cx="95" cy="155" r="42" stroke-width="2.8" />
  <circle cx="95" cy="155" r="30" stroke-dasharray="2 3" stroke-width="1.2" />
  <circle cx="95" cy="155" r="10" fill="#000000" />
  
  <!-- Spoked Front Wheel -->
  <circle cx="315" cy="155" r="42" stroke-width="2.8" />
  <circle cx="315" cy="155" r="30" stroke-dasharray="2 3" stroke-width="1.2" />
  <circle cx="315" cy="155" r="10" fill="#000000" />
  
  <!-- Classic Front Metal Mudguard -->
  <path d="M 280,135 Q 315,100 350,140" stroke-width="2.8" />
  <path d="M 315,155 L 280,75" stroke-width="2.8" />
  
  <!-- Round Headlamp with Tiger Eyes & Round Mirrors -->
  <circle cx="282" cy="72" r="12" stroke-width="2.2" />
  <path d="M 275,70 L 255,55 L 245,55" stroke-width="2.5" />
  <circle cx="240" cy="45" r="7" />
  
  <!-- Teardrop Fuel Tank (Royal Enfield Iconic Shape) -->
  <path d="M 270,72 Q 225,50 185,75 Q 175,88 175,105 L 265,95 Z" stroke-width="2.8" />
  <ellipse cx="225" cy="78" rx="16" ry="10" stroke-dasharray="4 2" stroke-width="1.5" />
  
  <!-- Single Sprung Rider Saddle -->
  <path d="M 175,100 Q 140,92 120,110 L 165,115 Z" stroke-width="2.5" />
  <circle cx="135" cy="115" r="4" stroke-width="1.5" />
  
  <!-- Classic Rear Curved Mudguard -->
  <path d="M 65,145 Q 85,95 135,110" stroke-width="2.8" />
  <!-- Pillion Seat with Rear Grab Rail -->
  <path d="M 120,105 Q 95,102 75,115" stroke-width="2" />
  <path d="M 65,120 L 55,120" stroke-width="2" />
  
  <!-- Cast Engine Block & Vertical Cylinder Head -->
  <rect x="190" y="110" width="35" height="45" rx="3" stroke-width="2.2" />
  <line x1="190" y1="118" x2="225" y2="118" stroke-width="1.5" />
  <line x1="190" y1="126" x2="225" y2="126" stroke-width="1.5" />
  <line x1="190" y1="134" x2="225" y2="134" stroke-width="1.5" />
  <circle cx="205" cy="142" r="12" stroke-width="2" />
  
  <!-- Long Peashooter Chrome Exhaust -->
  <path d="M 220,135 Q 230,165 190,165 L 70,165 L 60,162 L 60,168 L 70,165" stroke-width="2.8" />
  
  <text x="385" y="210" font-family="monospace" font-size="8" fill="#444444" text-anchor="end" stroke="none">ROYAL ENFIELD LINE ART • CLASSIC 350 BLUEPRINT</text>
</svg>
