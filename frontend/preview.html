  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
/* ==========================================================================
   Veloce Wheels Theme Design Tokens - Ultra-Professional Corporate ERP System
   ========================================================================== */
:root {
  --font-heading: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --radius-xs: 4px;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 18px;
  --radius-full: 9999px;
  --transition-fast: 120ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-normal: 180ms cubic-bezier(0.4, 0, 0.2, 1);
  --color-success: #059669;
  --color-success-bg: #ecfdf5;
  --color-success-border: #a7f3d0;
  --color-success-text: #065f46;
  --color-warning: #d97706;
  --color-warning-bg: #fffbeb;
  --color-warning-border: #fde68a;
  --color-warning-text: #92400e;
  --color-danger: #dc2626;
  --color-danger-bg: #fef2f2;
  --color-danger-border: #fecaca;
  --color-danger-text: #991b1b;
  --color-info: #1d4ed8;
  --color-info-bg: #eff6ff;
  --color-info-border: #bfdbfe;
  --color-info-text: #1e40af;
  --color-purple: #7c3aed;
  --color-purple-bg: #f5f3ff;
  --color-purple-border: #ddd6fe;
  --color-purple-text: #5b21b6;
}

[data-theme='light'] {
  --bg-app: #f8fafc;
  --bg-sidebar: #ffffff;
  --bg-surface: #ffffff;
  --bg-surface-elevated: #f1f5f9;
  --bg-card: #ffffff;
  --bg-card-hover: #ffffff;
  --bg-input: #ffffff;
  --bg-input-focus: #ffffff;
  --border-color: #e2e8f0;
  --border-color-hover: #cbd5e1;
  --border-active: var(--primary);
  --text-primary: #0f172a;
  --text-secondary: #475569;
  --text-muted: #64748b;
  --text-inverse: #ffffff;
  --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.07), 0 2px 4px -2px rgba(15, 23, 42, 0.05);
  --shadow-lg: 0 10px 15px -3px rgba(15, 23, 42, 0.08), 0 4px 6px -4px rgba(15, 23, 42, 0.04);
  --shadow-glow: 0 0 0 3px var(--primary-light);
}

[data-theme='dark'] {
  --bg-app: #0b0f19;
  --bg-sidebar: #0f172a;
  --bg-surface: #131d31;
  --bg-surface-elevated: #1a2742;
  --bg-card: #131d31;
  --bg-card-hover: #17233b;
  --bg-input: #0b111e;
  --bg-input-focus: #0f172a;
  --border-color: rgba(255, 255, 255, 0.08);
  --border-color-hover: rgba(255, 255, 255, 0.16);
  --border-active: var(--primary);
  --text-primary: #f8fafc;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --text-inverse: #0f172a;
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.25);
  --shadow-md: 0 4px 10px rgba(0, 0, 0, 0.3);
  --shadow-lg: 0 10px 22px rgba(0, 0, 0, 0.4);
  --shadow-glow: 0 0 0 3px rgba(29, 78, 216, 0.25);
  --color-success-bg: rgba(5, 150, 105, 0.14);
  --color-success-border: rgba(5, 150, 105, 0.3);
  --color-success-text: #34d399;
  --color-warning-bg: rgba(217, 119, 6, 0.14);
  --color-warning-border: rgba(217, 119, 6, 0.3);
  --color-warning-text: #fbbf24;
  --color-danger-bg: rgba(220, 38, 38, 0.14);
  --color-danger-border: rgba(220, 38, 38, 0.3);
  --color-danger-text: #f87171;
  --color-info-bg: rgba(29, 78, 216, 0.14);
  --color-info-border: rgba(29, 78, 216, 0.3);
  --color-info-text: #60a5fa;
  --color-purple-bg: rgba(124, 58, 237, 0.14);
  --color-purple-border: rgba(124, 58, 237, 0.3);
  --color-purple-text: #a78bfa;
}

[data-accent='cobalt'], :root {
  --primary: #1d4ed8;
  --primary-hover: #1e40af;
  --primary-light: rgba(29, 78, 216, 0.1);
  --primary-bg: rgba(29, 78, 216, 0.05);
  --primary-border: rgba(29, 78, 216, 0.25);
  --primary-glow: rgba(29, 78, 216, 0.15);
  --primary-text: #ffffff;
}

[data-accent='titanium'] {
  --primary: #334155;
  --primary-hover: #1e293b;
  --primary-light: rgba(51, 65, 85, 0.1);
  --primary-bg: rgba(51, 65, 85, 0.05);
  --primary-border: rgba(51, 65, 85, 0.25);
  --primary-glow: rgba(51, 65, 85, 0.15);
  --primary-text: #ffffff;
}

[data-accent='navy'] {
  --primary: #1e3a8a;
  --primary-hover: #172554;
  --primary-light: rgba(30, 58, 138, 0.1);
  --primary-bg: rgba(30, 58, 138, 0.05);
  --primary-border: rgba(30, 58, 138, 0.25);
  --primary-glow: rgba(30, 58, 138, 0.15);
  --primary-text: #ffffff;
}

[data-accent='emerald'] {
  --primary: #047857;
  --primary-hover: #065f46;
  --primary-light: rgba(4, 120, 87, 0.1);
  --primary-bg: rgba(4, 120, 87, 0.05);
  --primary-border: rgba(4, 120, 87, 0.25);
  --primary-glow: rgba(4, 120, 87, 0.15);
  --primary-text: #ffffff;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { margin: 0; padding: 0; background: var(--bg-app); color: var(--text-primary); font-family: var(--font-body); }
button, input, select, textarea { font-family: inherit; }
  </style>
  <!-- React & Babel for zero-build standalone preview -->

  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Sample bikes with 4 standard inspection photo angles:
    // 0: Front Look, 1: Front Tyre (Compulsory), 2: Back Tyre (Compulsory), 3: Back Look
    const sampleBikes = [
      {

        photos: [
          'https://images.unsplash.com/photo-1558981806-ec527fa84c39?auto=format&fit=crop&w=800&q=80', // Front Look
          'https://images.unsplash.com/photo-1609630875171-b1321377ee65?auto=format&fit=crop&w=800&q=80', // Front Tyre
          'https://images.unsplash.com/photo-1568772585407-9361f9bf3a87?auto=format&fit=crop&w=800&q=80', // Back Tyre
          'https://images.unsplash.com/photo-1558981403-c5f9899a28bc?auto=format&fit=crop&w=800&q=80'  // Back Look
        ]
      },
      {
        id: 'bk-3', stock_id: 'VB-2023-03', brand: 'KTM', model: 'Duke 200 BS6', year: 2022, km_driven: 9800, mileage: '32 km/l', color: 'Electronic Orange', purchase_price: 140000, selling_price: 165000, status: 'available', reg_number: 'TN 10 DK 9021',
        photos: [
          'https://images.unsplash.com/photo-1609630875171-b1321377ee65?auto=format&fit=crop&w=800&q=80', // Front Look
          'https://images.unsplash.com/photo-1568772585407-9361f9bf3a87?auto=format&fit=crop&w=800&q=80', // Front Tyre
          'https://images.unsplash.com/photo-1558981806-ec527fa84c39?auto=format&fit=crop&w=800&q=80', // Back Tyre
          'https://images.unsplash.com/photo-1558981403-c5f9899a28bc?auto=format&fit=crop&w=800&q=80'  // Back Look
        ]
      },
      {
        id: 'bk-4', stock_id: 'VB-2023-04', brand: 'Honda', model: 'Activa 6G DLX', year: 2022, km_driven: 11200, mileage: '55 km/l', color: 'Pearl Blue', purchase_price: 54000, selling_price: 68000, status: 'available', reg_number: 'TN 02 AY 3314',
        photos: [
          'https://images.unsplash.com/photo-1568772585407-9361f9bf3a87?auto=format&fit=crop&w=800&q=80',
          'https://images.unsplash.com/photo-1609630875171-b1321377ee65?auto=format&fit=crop&w=800&q=80',
          'https://images.unsplash.com/photo-1558981806-ec527fa84c39?auto=format&fit=crop&w=800&q=80',
          'https://images.unsplash.com/photo-1558981403-c5f9899a28bc?auto=format&fit=crop&w=800&q=80'
        ]
      },
      {
        id: 'bk-6', stock_id: 'VB-2023-06', brand: 'Bajaj', model: 'Pulsar NS200', year: 2019, km_driven: 28000, mileage: '36 km/l', color: 'Pewter Grey', purchase_price: 66000, selling_price: 82000, status: 'reserved', reg_number: 'TN 22 BR 1190',
        photos: [
          'https://images.unsplash.com/photo-1558981806-ec527fa84c39?auto=format&fit=crop&w=800&q=80',
          'https://images.unsplash.com/photo-1609630875171-b1321377ee65?auto=format&fit=crop&w=800&q=80',
          'https://images.unsplash.com/photo-1568772585407-9361f9bf3a87?auto=format&fit=crop&w=800&q=80',
          'https://images.unsplash.com/photo-1558981403-c5f9899a28bc?auto=format&fit=crop&w=800&q=80'
        ]
      },
      {
        id: 'bk-7', stock_id: 'VB-2023-07', brand: 'Suzuki', model: 'Access 125', year: 2021, km_driven: 13000, mileage: '52 km/l', color: 'Platinum Silver', purchase_price: 51000, selling_price: 64000, status: 'sold', reg_number: 'TN 05 AZ 8841',
        photos: [
          'https://images.unsplash.com/photo-1568772585407-9361f9bf3a87?auto=format&fit=crop&w=800&q=80',
          'https://images.unsplash.com/photo-1609630875171-b1321377ee65?auto=format&fit=crop&w=800&q=80',
          'https://images.unsplash.com/photo-1558981806-ec527fa84c39?auto=format&fit=crop&w=800&q=80',
          'https://images.unsplash.com/photo-1558981403-c5f9899a28bc?auto=format&fit=crop&w=800&q=80'
        ]
      }
    ];

    // Clean static card without hover movements
    function Card3D({ children, style = {}, onClick, ...props }) {
      return (
        <div
          onClick={onClick}
          className="card-3d"
          style={{
            backgroundColor: 'var(--bg-card)',
            border: '1px solid var(--border-color)',
            borderRadius: '14px',
            position: 'relative',
            overflow: 'hidden',
            boxShadow: 'var(--shadow-sm)',
            ...style
          }}
          {...props}
        >
          {children}
        </div>
      );
    }

    // Clean Photo Card without hover animation
    function BikeCardImage({ bike, onOpen3D }) {
      const photos = bike.photos || [bike.photo];
      const [idx, setIdx] = useState(0);

      return (
        <div
          style={{ position: 'relative', height: '175px', backgroundColor: '#0f172a', overflow: 'hidden' }}
        >
          <img
            src={photos[idx]}
            alt={bike.model}
            style={{
              width: '100%',
              height: '100%',
              objectFit: 'cover'
            }}
          />

          {/* Photo Angle Tag Badge */}
          <div
            style={{
              position: 'absolute',
              top: '10px',
              left: '10px',
              padding: '3px 8px',
              borderRadius: '4px',
              backgroundColor: idx === 1 || idx === 2 ? 'rgba(217, 119, 6, 0.9)' : 'rgba(15, 23, 42, 0.85)',
              color: '#ffffff',
              fontSize: '0.68rem',
              fontWeight: 800,
              border: '1px solid rgba(255,255,255,0.2)',
              backdropFilter: 'blur(6px)',
              zIndex: 6
            }}
          >
            {idx === 0 ? '🏍️ Front' : idx === 1 ? '🛞 Front Tyre' : idx === 2 ? '🛞 Back Tyre' : idx === 3 ? '🏍️ Back Look' : `📷 Angle ${idx + 1}`}
          </div>

          {/* 360 Spin Trigger Badge */}
          <button
            onClick={(e) => { e.stopPropagation(); onOpen3D(bike); }}
            style={{
              position: 'absolute',
              top: '10px',
              right: '10px',
              padding: '5px 10px',
              borderRadius: '20px',
              backgroundColor: 'rgba(15, 23, 42, 0.85)',
              color: '#ffffff',
              border: '1px solid rgba(255,255,255,0.25)',
              fontSize: '0.72rem',
              fontWeight: 700,
              cursor: 'pointer',
              zIndex: 6,
              backdropFilter: 'blur(6px)',
              display: 'flex',
              alignItems: 'center',
              gap: '4px'
            }}
          >
            🔄 360° 3D
          </button>

          {/* Dots Indicator */}
          {photos.length > 1 && (
            <div style={{ position: 'absolute', bottom: '6px', left: '50%', transform: 'translateX(-50%)', display: 'flex', gap: '4px', zIndex: 6, padding: '2px 6px', borderRadius: '10px', backgroundColor: 'rgba(0,0,0,0.5)' }}>
              {photos.map((_, i) => (
                <div
                  key={i}
                  onClick={(e) => { e.stopPropagation(); setIdx(i); }}
                  style={{ width: i === idx ? '12px' : '5px', height: '5px', borderRadius: '3px', backgroundColor: i === idx ? 'var(--primary)' : 'rgba(255,255,255,0.6)', cursor: 'pointer' }}
                />
              ))}
            </div>
          )}
        </div>
      );
    }

    // 3D Showroom Turntable Modal
    function TurntableModal({ bike, onClose }) {
      if (!bike) return null;
      const [angle, setAngle] = useState(0);
      const [isAutoSpin, setIsAutoSpin] = useState(true);
      const [isDragging, setIsDragging] = useState(false);
      const [startX, setStartX] = useState(0);
      const [startAngle, setStartAngle] = useState(0);
      const photos = bike.photos || [bike.photo];

      useEffect(() => {
        if (!isAutoSpin) return;
        const timer = setInterval(() => {
          setAngle(prev => (prev + 1) % 360);
        }, 40);
        return () => clearInterval(timer);
      }, [isAutoSpin]);

      const activePhotoIndex = Math.floor((angle / 360) * photos.length) % photos.length;

      const handleMouseDown = (e) => {
        setIsDragging(true);
        setStartX(e.clientX);
        setStartAngle(angle);
        setIsAutoSpin(false);
      };

      const handleMouseMove = (e) => {
        if (!isDragging) return;
        const delta = e.clientX - startX;
        setAngle((startAngle + Math.round(delta * 0.8) + 3600) % 360);
      };

      return (
        <div style={{ position: 'fixed', inset: 0, backgroundColor: 'rgba(0,0,0,0.75)', backdropFilter: 'blur(8px)', zIndex: 1000, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '20px' }}>
          <div style={{ width: '100%', maxWidth: '780px', backgroundColor: 'var(--bg-card)', border: '1px solid var(--border-color)', borderRadius: '16px', overflow: 'hidden', boxShadow: '0 25px 50px -12px rgba(0,0,0,0.5)' }}>
            {/* Header */}
            <div style={{ padding: '16px 20px', borderBottom: '1px solid var(--border-color)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <div>
                <h3 style={{ fontSize: '1.2rem', fontWeight: 800 }}>3D Showroom Turntable: {bike.brand} {bike.model}</h3>
                <span style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>Interactive 360° Virtual Inspection • ⚡ {bike.mileage}</span>
              </div>
              <button onClick={onClose} style={{ border: 'none', background: 'transparent', fontSize: '1.4rem', cursor: 'pointer', color: 'var(--text-secondary)' }}>✕</button>
            </div>

            {/* 3D Stage */}
            <div
              onMouseDown={handleMouseDown}
              onMouseMove={handleMouseMove}
              onMouseUp={() => setIsDragging(false)}
              style={{ position: 'relative', height: '340px', backgroundColor: 'var(--bg-app)', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: isDragging ? 'grabbing' : 'grab', userSelect: 'none', overflow: 'hidden' }}
            >
              {/* Showroom Spotlight */}
              <div style={{ position: 'absolute', top: 0, left: '50%', transform: 'translateX(-50%)', width: '400px', height: '200px', background: 'radial-gradient(ellipse at 50% 0%, var(--primary-light) 0%, transparent 70%)', pointerEvents: 'none' }} />

              {/* Rotating 3D Floor Ring */}
              <div style={{
                position: 'absolute',
                bottom: '15px',
                left: '50%',
                transform: `translateX(-50%) rotateX(74deg) rotateZ(${angle}deg)`,
                width: '400px',
                height: '400px',
                borderRadius: '50%',
                border: '2px dashed var(--primary-border)',
                boxShadow: '0 0 40px var(--primary-glow)',
                pointerEvents: 'none'
              }} />

              {/* Bike Image on Turntable */}
              <div style={{ position: 'relative', zIndex: 3, display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
                <img
                  src={photos[activePhotoIndex]}
                  alt={bike.model}
                  style={{ maxHeight: '240px', maxWidth: '500px', objectFit: 'contain', filter: 'drop-shadow(0 20px 25px rgba(0,0,0,0.35))', pointerEvents: 'none' }}
                />
                <div style={{ width: '300px', height: '20px', borderRadius: '50%', backgroundColor: 'rgba(0,0,0,0.3)', filter: 'blur(8px)', marginTop: '-8px' }} />
              </div>

              {/* HUD Badge with Angle Name */}
              <div style={{ position: 'absolute', top: '14px', left: '16px', padding: '6px 12px', borderRadius: '20px', backgroundColor: 'rgba(15, 23, 42, 0.85)', color: '#ffffff', fontSize: '0.78rem', fontWeight: 700, backdropFilter: 'blur(6px)', display: 'flex', alignItems: 'center', gap: '6px' }}>
                <span>🧭 {angle}°</span>
                <span>•</span>
                <span style={{ color: activePhotoIndex === 1 || activePhotoIndex === 2 ? '#f59e0b' : '#38bdf8' }}>
                  {activePhotoIndex === 0 ? '🏍️ 1. Front Look' : activePhotoIndex === 1 ? '🛞 2. Front Tyre (Compulsory)' : activePhotoIndex === 2 ? '🛞 3. Back Tyre (Compulsory)' : activePhotoIndex === 3 ? '🏍️ 4. Back Look' : `Angle ${activePhotoIndex + 1}`}
                </span>
              </div>

              <div style={{ position: 'absolute', top: '14px', right: '16px', padding: '6px 12px', borderRadius: '20px', backgroundColor: 'rgba(15, 23, 42, 0.75)', color: '#94a3b8', fontSize: '0.74rem' }}>
                👆 Drag to rotate 360°
              </div>
            </div>

            {/* Slider & Controls */}
            <div style={{ padding: '16px 20px', display: 'flex', flexDirection: 'column', gap: '12px' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                <span style={{ fontSize: '0.78rem', fontWeight: 700, color: 'var(--text-muted)' }}>0°</span>
                <input
                  type="range"
                  min="0"
                  max="359"
                  value={angle}
                  onChange={(e) => { setAngle(Number(e.target.value)); setIsAutoSpin(false); }}
                  style={{ flex: 1, accentColor: 'var(--primary)', cursor: 'pointer' }}
                />
                <span style={{ fontSize: '0.78rem', fontWeight: 700, color: 'var(--text-muted)' }}>360°</span>
              </div>

              {/* 4-Angle Filmstrip */}
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '8px' }}>
                {['1. Front Look', '2. Front Tyre ⭐', '3. Back Tyre ⭐', '4. Back Look'].map((label, pIdx) => {
                  const pUrl = photos[pIdx];
                  const isSel = pIdx === activePhotoIndex;
                  return (
                    <div
                      key={pIdx}
                      onClick={() => { setAngle(pIdx * 90); setIsAutoSpin(false); }}
                      style={{
                        position: 'relative',
                        height: '62px',
                        borderRadius: '6px',
                        overflow: 'hidden',
                        cursor: 'pointer',
                        border: isSel ? '2px solid var(--primary)' : '1px solid var(--border-color)',
                        opacity: isSel ? 1 : 0.75
                      }}
                    >
                      {pUrl && <img src={pUrl} alt={label} style={{ width: '100%', height: '100%', objectFit: 'cover' }} />}
                      <span style={{ position: 'absolute', bottom: 0, left: 0, right: 0, padding: '2px', fontSize: '0.64rem', fontWeight: 800, textAlign: 'center', backgroundColor: pIdx === 1 || pIdx === 2 ? 'rgba(217, 119, 6, 0.92)' : 'rgba(0,0,0,0.75)', color: '#ffffff' }}>
                        {label}
                      </span>
                    </div>
                  );
                })}
              </div>

              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <button
                  onClick={() => setIsAutoSpin(!isAutoSpin)}
                  style={{ padding: '6px 14px', borderRadius: '8px', border: '1px solid var(--border-color)', backgroundColor: isAutoSpin ? 'var(--primary)' : 'transparent', color: isAutoSpin ? 'var(--primary-text)' : 'var(--text-primary)', fontWeight: 700, fontSize: '0.8rem', cursor: 'pointer' }}
                >
                  {isAutoSpin ? '⏸ Pause 360°' : '▶ Auto 360° Spin'}
                </button>

    // Isolated Print Engine for Thermal & A4
    function printIsolatedDoc(elementId, options = {}) {
      const source = document.getElementById(elementId);
      if (!source) {
        window.print();
        return;
      }
      const { isThermal = false, thermalWidth = '80mm', title = 'Print Document' } = options;
      
      const oldFrame = document.getElementById('veloce-preview-print-frame');
      if (oldFrame) oldFrame.remove();

      const frame = document.createElement('iframe');
      frame.id = 'veloce-preview-print-frame';
      frame.style.position = 'fixed';
      frame.style.right = '0';
      frame.style.bottom = '0';
      frame.style.width = '0';
      frame.style.height = '0';
      frame.style.border = 'none';
      frame.style.visibility = 'hidden';
      document.body.appendChild(frame);

      const doc = frame.contentWindow.document;
      doc.open();
      const styles = isThermal ? `
        @page { size: ${thermalWidth} auto; margin: 0mm; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
          width: ${thermalWidth};
          max-width: ${thermalWidth};
          margin: 0 auto;
          padding: 2mm 3mm;
          background: #ffffff !important;
          color: #000000 !important;
          font-family: 'Courier New', Courier, monospace;
          font-size: 11px;
          line-height: 1.35;
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
        .no-print, button { display: none !important; }
        table { width: 100%; border-collapse: collapse; }
      ` : `
        @page { size: A4 portrait; margin: 10mm; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
          width: 100%;
          margin: 0;
          padding: 0;
          background: #ffffff !important;
          color: #0f172a !important;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          font-size: 13px;
          line-height: 1.45;
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
        .no-print, button { display: none !important; }
        table { width: 100%; border-collapse: collapse; }
      `;

      doc.write(`
        <!DOCTYPE html>
        <html>
          <head>
            <meta charset="utf-8" />
            <title>${title}</title>
            <style>${styles}</style>
          </head>
          <body>
            ${source.innerHTML}
          </body>
        </html>
      `);
      doc.close();

      setTimeout(() => {
        try {
          frame.contentWindow.focus();
          frame.contentWindow.print();
        } finally {
          setTimeout(() => { if (frame.parentNode) frame.parentNode.removeChild(frame); }, 2000);
        }
      }, 250);
    }

                  onClick={() => setCurrentUser(null)}
                  title="Sign out"
                  style={{ padding: '4px 8px', borderRadius: '6px', border: '1px solid rgba(239, 68, 68, 0.4)', backgroundColor: 'rgba(239, 68, 68, 0.08)', color: '#ef4444', fontWeight: 700, fontSize: '0.74rem', cursor: 'pointer' }}
                >
                  🚪 Logout
                </button>
              </div>
            </div>
          </header>

          {/* Body */}
          <div style={{ display: 'flex', flex: 1 }}>
            {deviceMode === 'desktop' && (
              <aside style={{ width: '240px', backgroundColor: 'var(--bg-sidebar)', borderRight: '1px solid var(--border-color)', padding: '20px 10px', display: 'flex', flexDirection: 'column', gap: '6px' }}>
                <button onClick={() => setTab('dashboard')} style={{ padding: '10px', border: 'none', borderRadius: '8px', textAlign: 'left', fontWeight: 600, cursor: 'pointer', backgroundColor: tab === 'dashboard' ? 'var(--primary)' : 'transparent', color: tab === 'dashboard' ? 'var(--primary-text)' : 'var(--text-secondary)' }}>
                  📊 Showroom Dashboard
                </button>
                <button onClick={() => setTab('inventory')} style={{ padding: '10px', border: 'none', borderRadius: '8px', textAlign: 'left', fontWeight: 600, cursor: 'pointer', backgroundColor: tab === 'inventory' ? 'var(--primary)' : 'transparent', color: tab === 'inventory' ? 'var(--primary-text)' : 'var(--text-secondary)' }}>
                  🏍️ Bike Inventory (3D)
                </button>
                <button onClick={() => setTab('inspection')} style={{ padding: '10px', border: 'none', borderRadius: '8px', textAlign: 'left', fontWeight: 600, cursor: 'pointer', backgroundColor: tab === 'inspection' ? 'var(--primary)' : 'transparent', color: tab === 'inspection' ? 'var(--primary-text)' : 'var(--text-secondary)' }}>
                  🔍 14-Point Inspection
                </button>
                <button onClick={() => setTab('enquiries')} style={{ padding: '10px', border: 'none', borderRadius: '8px', textAlign: 'left', fontWeight: 600, cursor: 'pointer', backgroundColor: tab === 'enquiries' ? 'var(--primary)' : 'transparent', color: tab === 'enquiries' ? 'var(--primary-text)' : 'var(--text-secondary)' }}>
                  📈 Leads & Pipeline
                </button>
                <button onClick={() => setTab('sales')} style={{ padding: '10px', border: 'none', borderRadius: '8px', textAlign: 'left', fontWeight: 600, cursor: 'pointer', backgroundColor: tab === 'sales' ? 'var(--primary)' : 'transparent', color: tab === 'sales' ? 'var(--primary-text)' : 'var(--text-secondary)' }}>
                  🧾 Sales & Tax Invoices
                </button>
                <button onClick={() => setTab('catalog')} style={{ padding: '10px', border: 'none', borderRadius: '8px', textAlign: 'left', fontWeight: 700, cursor: 'pointer', backgroundColor: tab === 'catalog' ? 'var(--primary)' : 'var(--primary-bg)', color: tab === 'catalog' ? 'var(--primary-text)' : 'var(--primary)' }}>
                  🌐 3D Customer Discovery
                </button>
              </aside>
            )}

            {/* Main Area */}
            <main style={{ flex: 1, padding: '24px' }}>
              {tab === 'dashboard' && (
                <div>
                  <h2 style={{ fontSize: '1.5rem', fontWeight: 800 }}>Showroom Dashboard</h2>
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '14px', marginTop: '16px' }}>
                    <Card3D style={{ padding: '16px' }}>
                      <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>TOTAL STOCK</div>
                      <div style={{ fontSize: '1.8rem', fontWeight: 800 }}>6 Bikes</div>
                    </Card3D>
                    <Card3D style={{ padding: '16px' }}>
                      <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>AVAILABLE FOR SALE</div>
                      <div style={{ fontSize: '1.8rem', fontWeight: 800, color: 'var(--color-success)' }}>4 Units</div>
                    </Card3D>
                    <Card3D style={{ padding: '16px' }}>
                      <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>TOTAL INVESTMENT</div>
                      <div style={{ fontSize: '1.8rem', fontWeight: 800, color: 'var(--primary)' }}>₹6,05,800</div>
                    </Card3D>
                    <Card3D style={{ padding: '16px' }}>
                      <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>REALIZED NET PROFIT</div>
                      <div style={{ fontSize: '1.8rem', fontWeight: 800, color: 'var(--color-success)' }}>+₹10,900</div>
                    </Card3D>
                  </div>
                </div>
              )}

              {(tab === 'inventory' || tab === 'catalog') && (
                <div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '10px' }}>
                    <div>
                      <h2 style={{ fontSize: '1.5rem', fontWeight: 800 }}>
                        {tab === 'inventory' ? 'Inventory Stock List (3D View)' : 'Customer 3D Virtual Showroom'}
                      </h2>
                      <p style={{ fontSize: '0.85rem', color: 'var(--text-muted)' }}>
                        All bikes include mandatory 4-angle inspection pack (Front, Front Tyre ⭐, Back Tyre ⭐, Back Look).
                      </p>
                    </div>
                    {tab === 'inventory' && (
                      <button
                        onClick={() => setIsAddBikeOpen(true)}
                        style={{
                          padding: '10px 18px',
                          borderRadius: '8px',
                          border: 'none',
                          backgroundColor: 'var(--primary)',
                          color: '#ffffff',
                          fontWeight: 700,
                          fontSize: '0.85rem',
                          cursor: 'pointer',
                          display: 'flex',
                          alignItems: 'center',
                          gap: '6px'
                        }}
                      >
                        ➕ Add Bike (+ 4 Photos)
                      </button>
                    )}
                  </div>

                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(290px, 1fr))', gap: '20px', marginTop: '16px' }}>
                    {bikesList.map(b => (
                      <Card3D key={b.id}>
                        {/* 3D Image Hover Scroller */}
                        <BikeCardImage bike={b} onOpen3D={(targetBike) => setModal3D(targetBike)} />

                        <div style={{ padding: '16px' }}>
                          <span style={{ fontSize: '0.75rem', fontWeight: 700, color: 'var(--text-muted)' }}>{b.stock_id}</span>
                          <h3 style={{ fontSize: '1.15rem', fontWeight: 700, margin: '2px 0 8px 0' }}>{b.brand} {b.model}</h3>
                          <div style={{ fontSize: '0.8rem', color: 'var(--text-secondary)', display: 'flex', gap: '6px', flexWrap: 'wrap', alignItems: 'center' }}>
                            <span>{b.year}</span> • 
                            <span>{b.km_driven.toLocaleString()} KM</span> • 
                            <span style={{ color: 'var(--color-success-text)', fontWeight: 700 }}>⚡ {b.mileage}</span> • 
                            <span>{b.reg_number}</span>
                          </div>

                          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: '14px', paddingTop: '10px', borderTop: '1px solid var(--border-color)' }}>
                            <span style={{ fontSize: '1.25rem', fontWeight: 800, color: 'var(--primary)' }}>{formatRupee(b.selling_price)}</span>
                            <div style={{ display: 'flex', gap: '6px', alignItems: 'center' }}>
                              <button
                                onClick={() => setModal3D(b)}
                                style={{ padding: '4px 10px', borderRadius: '8px', border: '1px solid var(--primary-border)', backgroundColor: 'var(--primary-bg)', color: 'var(--primary)', fontWeight: 700, fontSize: '0.75rem', cursor: 'pointer' }}
                              >
                                360° Spin
                              </button>
                              <span style={{ padding: '3px 8px', borderRadius: '12px', fontSize: '0.72rem', fontWeight: 700, backgroundColor: b.status === 'available' ? 'var(--color-success-bg)' : 'var(--color-warning-bg)', color: b.status === 'available' ? 'var(--color-success)' : 'var(--color-warning)' }}>
                                {b.status.toUpperCase()}
                              </span>
                            </div>
                          </div>
                        </div>
                      </Card3D>
                    ))}
                  </div>
                </div>
              )}

              {tab === 'sales' && (
                <div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' }}>
                    <div>
                      <h2 style={{ fontSize: '1.5rem', fontWeight: 800 }}>🧾 Sales Invoices & 4" POS Billing</h2>
                      <p style={{ fontSize: '0.85rem', color: 'var(--text-muted)' }}>
                        Instant 4-inch (100mm) thermal POS roll bill and tax invoice generation with live preview.
                      </p>
                    </div>
                  </div>

                  <div style={{ display: 'flex', flexDirection: 'column', gap: '14px' }}>
                    {sampleSales.map(s => (
                      <Card3D key={s.id} style={{ padding: '18px' }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '14px' }}>
                          <div>
                            <span style={{ fontSize: '0.75rem', fontWeight: 700, color: 'var(--primary)' }}>{s.invoice_number}</span>
                            <h3 style={{ fontSize: '1.15rem', fontWeight: 800, margin: '2px 0 4px 0' }}>{s.bike_title}</h3>
                            <div style={{ fontSize: '0.82rem', color: 'var(--text-secondary)' }}>
                              Buyer: <strong>{s.customer_name}</strong> • Phone: {s.customer_phone} • Mode: {s.payment_mode}
                            </div>
                            <div style={{ fontSize: '0.78rem', color: 'var(--text-muted)', marginTop: '2px' }}>
                              Date: {s.sale_date} • Mileage: <span style={{ color: 'var(--color-success-text)', fontWeight: 600 }}>⚡ {s.mileage}</span>
                            </div>
                          </div>

                          <div style={{ display: 'flex', alignItems: 'center', gap: '16px' }}>
                            <div style={{ textAlign: 'right' }}>
                              <span style={{ fontSize: '0.75rem', color: 'var(--text-muted)', display: 'block' }}>Paid Amount</span>
                              <span style={{ fontSize: '1.3rem', fontWeight: 800, color: 'var(--primary)' }}>{formatRupee(s.total_amount)}</span>
                            </div>

                            <div style={{ display: 'flex', gap: '8px' }}>
                              <button
                                onClick={() => { setSelectedBill(s); setBillFormat('4inch'); }}
                                style={{ padding: '8px 14px', borderRadius: '8px', border: 'none', backgroundColor: 'var(--primary)', color: '#ffffff', fontWeight: 700, fontSize: '0.8rem', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '6px' }}
                              >
                                🧾 4" POS Bill
                              </button>
                              <button
                                onClick={() => { setSelectedBill(s); setBillFormat('a4'); }}
                                style={{ padding: '8px 14px', borderRadius: '8px', border: '1px solid var(--border-color)', backgroundColor: 'transparent', color: 'var(--text-primary)', fontWeight: 700, fontSize: '0.8rem', cursor: 'pointer' }}
                              >
                                📄 A4
                              </button>
                            </div>
                          </div>
                        </div>
                      </Card3D>
                    ))}
                  </div>
                </div>
              )}
            </main>
          </div>

          {/* 3D Showroom Turntable Modal */}
          {modal3D && <TurntableModal bike={modal3D} onClose={() => setModal3D(null)} />}

          {/* 4-Inch Thermal POS Bill Modal */}
          {selectedBill && (
            <ThermalBillModal
              invoice={selectedBill}
              format={billFormat}
              onFormatChange={setBillFormat}
              onClose={() => setSelectedBill(null)}
            />
          )}

          {/* Add Bike Modal with 4 Mandatory Photo Inspection Pack */}
          <AddBikeModal
            isOpen={isAddBikeOpen}
            onClose={() => setIsAddBikeOpen(false)}
            onAddBike={(newB) => setBikesList(prev => [newB, ...prev])}
          />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
